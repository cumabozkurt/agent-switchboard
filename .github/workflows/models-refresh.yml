name: models-snapshot
# Her gün OpenRouter ve OpenCode Zen'in herkese açık model listelerini çekip depoya kaydeder;
# böylece README ve arayüzdeki öneriler hep güncel kalır. Uygulama çalışırken yine canlı listeyi kullanır.
on:
  schedule: [{ cron: '17 3 * * *' }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/snapshot-models.js
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add models/ && git diff --cached --quiet || (git commit -m "chore: güncel model listesi" && git push)
