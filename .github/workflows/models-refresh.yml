name: models-snapshot
# Her gün OpenRouter, OpenCode Zen ve OpenCode Go'nun herkese açık model listelerini çekip depoya kaydeder.
# Uygulama çalışırken yine canlı listeyi kullanır; bu anlık görüntüler yalnızca başvuru içindir.
# Liste değişmediyse commit atılmaz.
on:
  schedule: [{ cron: '17 3 * * *' }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: models-snapshot, cancel-in-progress: false }
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: node scripts/snapshot-models.js
      - name: Değiştiyse commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/
          if git diff --cached --quiet; then echo "Model listeleri değişmedi."; exit 0; fi
          git commit -m "chore: güncel model listesi"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
